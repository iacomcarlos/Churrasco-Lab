<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Ícone</title>
<!-- Gera public/icon.png, apple-icon.png e favicon-48.png com a logo branca oficial sobre carvão. -->
<style>
  * { margin: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
  .box { width: 512px; height: 512px; display: grid; place-items: center; background: radial-gradient(90% 80% at 50% 100%, #b8440e 0%, #3a1c0e 42%, #100a07 80%); }
  img { width: 80%; height: auto; }
</style>
</head>
<body>
  <div class="box" id="box"><img src="../public/brand/logo-branca.png" alt="" /></div>
<script>
  // ?apple → sem cantos arredondados (o iPhone arredonda sozinho)
  document.getElementById("box").style.borderRadius = location.search.includes("apple") ? "0" : "112px";
</script>
</body>
</html>
